# Netlify regenera las páginas del sitio a partir de funnyfoot-sitio/datos/productos.json
# (lo que edita el panel de administración) y publica la carpeta funnyfoot-sitio.
[build]
  command = "python3 fuentes-del-sitio/build_site.py"
  publish = "funnyfoot-sitio"

# Servicio del panel de administración (valida usuario y código y publica en GitHub).
[functions]
  directory = "netlify/functions"
